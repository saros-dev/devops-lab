name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. گرفتن کد
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. نصب Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. نصب dependencies
      - name: Install Dependencies
        run: |
          pip install -r ./todo-app/requirements.txt

      # 4. اجرای تست‌ها
      - name: Run Tests
        working-directory: ./todo-app
        run: python -m pytest

      # 5. بررسی Secrets (اصلاح شده)
      - name: Check Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "🔍 بررسی اعتبارنامه‌های داکر..."

          if [ -z "$DOCKER_USERNAME" ]; then
            echo "❌ DOCKER_USERNAME خالی است"
            exit 1
          else
            echo "✅ DOCKER_USERNAME وجود دارد"
          fi

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "❌ DOCKER_TOKEN خالی است"
            exit 1
          else
            echo "✅ DOCKER_TOKEN وجود دارد"
          fi

      # 6. لاگین به Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 7. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app:latest ./todo-app

      # 8. Push Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/todo-app:latest
