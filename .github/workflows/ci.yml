name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r ./todo-app/requirements.txt

      - name: Run Tests
        working-directory: ./todo-app
        run: python -m pytest

      # 🔴 DEBUG STEP (مهم)
      - name: Check Docker Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME is EMPTY"
            exit 1
          else
            echo "✅ DOCKER_USERNAME exists"
          fi

          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "❌ DOCKER_TOKEN is EMPTY"
            exit 1
          else
            echo "✅ DOCKER_TOKEN exists"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/todo-app:latest ./todo-app

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/todo-app:latest
